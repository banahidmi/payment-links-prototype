<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment Links Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: merchant back office (header, tabs, work area) + a guide rail that walks reviewers through each scenario */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunken:#EEF1F5; --line:#DCE1E8; --ink:#17202E; --muted:#5D6878;
  --accent:#1F5FAF; --accent-ink:#FFFFFF; --accent-soft:#E3ECF8;
  --good:#1E7A4C; --good-soft:#DFF2E7; --warn:#9A6200; --warn-soft:#FBEFD6; --bad:#B42318; --bad-soft:#FBE3E0; --info-soft:#EAF0F7;
  --shadow:0 8px 28px rgba(23,32,46,.14);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F141C; --surface:#171E29; --sunken:#1D2531; --line:#2B3544; --ink:#E7ECF3; --muted:#9AA6B7;
  --accent:#6FA3F0; --accent-ink:#0D1B2E; --accent-soft:#1C2E48;
  --good:#5CCB92; --good-soft:#163526; --warn:#E8B54D; --warn-soft:#3A2E12; --bad:#F2877D; --bad-soft:#3D1D1A; --info-soft:#1B2533;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141C; --surface:#171E29; --sunken:#1D2531; --line:#2B3544; --ink:#E7ECF3; --muted:#9AA6B7;
  --accent:#6FA3F0; --accent-ink:#0D1B2E; --accent-soft:#1C2E48;
  --good:#5CCB92; --good-soft:#163526; --warn:#E8B54D; --warn-soft:#3A2E12; --bad:#F2877D; --bad-soft:#3D1D1A; --info-soft:#1B2533;
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-inline:20px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px;max-width:1360px;margin-inline:auto}
.brand{display:flex;flex-direction:column}
.brand b{font-size:18px}
.badge-stage{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.top-tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.field-inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field-inline select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--warn)}
.switch input:checked::after{left:17px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1360px;margin-inline:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button.new-tab::after{content:"New";font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
nav.tabs button:disabled{opacity:.5;cursor:default}

/* Shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;max-width:1360px;margin-inline:auto;padding:20px}
@media (max-width:980px){.shell{grid-template-columns:1fr}.guide{order:-1}}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.page-head h1{font-size:22px;font-weight:600}
.page-head .spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-pad{padding:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{color:var(--bad)}
.btn-sm{padding:4px 9px;font-size:13px}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.channel:focus-visible,.pay-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi .label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .value{font-size:22px;font-weight:600;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--sunken)}
.cust b{display:block;font-weight:500}
.cust span{font-size:12px;color:var(--muted)}

/* Status pills */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.s-paid,.s-approved{background:var(--good-soft);color:var(--good)}
.s-sent{background:var(--info-soft);color:var(--accent)}
.s-opened,.s-pending{background:var(--warn-soft);color:var(--warn)}
.s-expired,.s-cancelled{background:var(--sunken);color:var(--muted)}
.s-declined,.s-failed{background:var(--bad-soft);color:var(--bad)}

/* Filter chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chips .search{margin-left:auto;border:1px solid var(--line);border-radius:7px;padding:5px 10px;background:var(--surface);min-width:0;width:220px;max-width:100%}

/* Guide rail */
.guide{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:980px){.guide{position:static}.guide .steps{max-height:60vh;overflow-y:auto}}
.steps::-webkit-scrollbar{width:8px}.steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.guide h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scn{display:flex;flex-direction:column;gap:6px}
.scn-btn{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.scn-btn:hover{background:var(--sunken)}
.scn-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scn-btn .n{width:24px;height:24px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-weight:600;font-size:12px}
.scn-btn[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
.scn-btn b{display:block;font-weight:600}
.scn-btn span{font-size:12px;color:var(--muted)}
.steps{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.steps h3{font-size:15px}
.steps .story{font-size:13px;color:var(--muted)}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;color:var(--muted);counter-increment:st;align-items:start}
.steps li::before{content:counter(st);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.steps li.done::before{content:"\2713";background:var(--good);border-color:var(--good);color:var(--surface)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now::before{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps .head{display:flex;align-items:center;gap:10px}
.steps .head .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;flex:none}
.progress{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.progress .bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.demo-ctl{border:1.5px dashed var(--warn);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--warn-soft)}
.demo-ctl .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.demo-ctl p{margin:0;font-size:13px;color:var(--ink)}
.btn-demo{background:var(--warn);border-color:var(--warn);color:var(--surface);justify-content:center}
.btn-demo:hover{background:var(--warn);filter:brightness(1.08)}
.back{align-self:flex-start}
.inbox{display:flex;flex-direction:column;gap:10px}
.inbox .app{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:13px;max-width:92%}
.bubble .from{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.tap{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;word-break:break-all;text-align:left}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.mail .subj{font-weight:600}
.preview-note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.steps .finish{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:500}
.guide-foot{display:flex;gap:8px;flex-wrap:wrap}
.guide-target{animation:pulse 1.6s ease-out infinite;position:relative;z-index:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.guide-target{animation:none;outline:2px dashed var(--accent);outline-offset:3px}}

/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,24,.42);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(720px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.drawer-head h2{font-size:18px;font-weight:600}
.drawer-head .x{margin-left:auto}
.drawer-body{padding:20px;display:flex;flex-direction:column;gap:18px}
.drawer-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.create-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}
@media (max-width:640px){.create-grid{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lbl{font-size:12px;font-weight:500;color:var(--muted)}
.fld input[type=text],.fld input[type=email],.fld input[type=number],.fld select{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%}
.fld.err input{border-color:var(--bad)}
.err-msg{font-size:12px;color:var(--bad)}
.hint{font-size:12px;color:var(--muted)}
.scn-group{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
.scn-btn.safe .n{border-radius:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.checks label.off{color:var(--muted);text-decoration:line-through}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:13px}
details.more[open] summary{margin-bottom:10px}
.notice{border-radius:8px;padding:10px 12px;font-size:13px}
.notice.ok{background:var(--good-soft);color:var(--good)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--info-soft);color:var(--ink)}
.notice b{font-weight:600}
.preview-lbl{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}

/* Customer checkout (phone) */
.phone{border:1px solid var(--line);border-radius:22px;background:var(--sunken);padding:14px;display:flex;flex-direction:column;gap:10px}
.phone .merchant{text-align:center;font-weight:600}
.phone .amt{text-align:center;font-size:24px;font-weight:600}
.phone .exp{text-align:center;font-size:12px;color:var(--muted)}
.pay-opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.pay-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.modal-scrim{position:fixed;inset:0;background:rgba(10,15,24,.5);z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(400px,100%);max-height:100%;overflow-y:auto}
.modal-head{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.modal-head b{font-size:14px}
.modal-head .tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:2px 6px}
.modal-head .x{margin-left:auto}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-block:10px}
.result .big{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700}
.result.ok .big{background:var(--good-soft);color:var(--good)}
.result.no .big{background:var(--bad-soft);color:var(--bad)}

/* Send step */
.channels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.channels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.channel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.channel[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.channel b{font-weight:600}
.channel span{font-size:12px;color:var(--muted)}
.msg{background:var(--sunken);border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--sunken);border-radius:8px;padding:8px 10px;overflow-x:auto}
.qr{width:150px;height:150px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}

/* Link detail */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
@media (max-width:560px){.detail-grid{grid-template-columns:1fr}}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding-bottom:12px;position:relative;font-size:13px}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:4px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline time{color:var(--muted);font-family:var(--mono);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.section-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Admin */
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.admin-grid{grid-template-columns:1fr}}
.admin-grid h2{font-size:15px;margin-bottom:10px}

/* Toasts */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px}
.toast b{display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Wide screens: scenarios live in a fixed right column; drawers open beside it, never over it */
@media (min-width:981px){
  body{padding-right:340px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .guide{position:fixed;top:0;right:0;bottom:0;align-self:stretch;max-height:100dvh;width:340px;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;background:var(--bg);border-left:1px solid var(--line);z-index:25}
  .scrim{right:340px}
  .guide > *{flex:none}
  .guide .steps{flex:0 1 auto;min-height:120px;overflow-y:auto;overscroll-behavior:contain}
  .toasts{right:356px}
}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand"><b>ProductTest <span class="badge-stage">Prototype</span></b><span class="muted" style="font-size:12px">Client back office · Payment Links concept</span></div>
    <div class="top-tools">
      <label class="field-inline" for="role-select">Viewing as
        <select id="role-select">
          <option value="agent">Lina · Support agent ($1,000 limit)</option>
          <option value="lead">Omar · Team lead ($5,000 limit)</option>
          <option value="admin">Dana · Admin (no limit)</option>
        </select>
      </label>
      <label class="switch" for="test-mode"><input type="checkbox" id="test-mode" checked> Test mode</label>
    </div>
  </div>
  <nav class="tabs" aria-label="Back office">
    <button data-nav="dashboard">Dashboard</button>
    <button data-nav="orders">Orders</button>
    <button data-nav="links" class="new-tab">Payment Links</button>
    <button disabled title="Not part of this prototype">Account</button>
    <button disabled title="Not part of this prototype">Payouts</button>
    <button disabled title="Not part of this prototype">Refunds</button>
    <button disabled title="Not part of this prototype">Reports</button>
    <button disabled title="Not part of this prototype">Alerts</button>
    <button data-nav="admin">Administration</button>
  </nav>
</header>

<div class="shell">
  <main id="main" aria-live="polite"></main>
  <aside class="guide" id="guide" aria-label="Demo scenarios"></aside>
</div>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);

function emit(ev) {
  const sc = S.scenario && SCENARIOS.find(s => s.key === S.scenario);
  if (!sc) return;
  const st = sc.steps[S.step];
  if (st && st.ev === ev) { S.step++; renderGuide(); applyGuide(); }
}
function startScenario(key) {
  const sc = SCENARIOS.find(s => s.key === key);
  S.scenario = key; S.step = 0; S.drawer = null; S.modal = null; S.lastLink = null;
  setRole(sc.role, true);
  S.view = (key === 'recovery' || key === 'cs') ? 'dashboard' : 'links';
  render();
}

/* ---------- rendering ---------- */
function render() {
  document.querySelectorAll('nav.tabs [data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === S.view ? 'page' : 'false'));
  $('#role-select').value = S.role;
  $('#test-mode').checked = S.testMode;
  $('#main').innerHTML = ({dashboard:viewDashboard, orders:viewOrders, links:viewLinks, admin:viewAdmin})[S.view]();
  renderGuide();
  renderLayer();
  drawQR();
  applyGuide();
}

function pill(status) {
  const cls = {'Paid':'s-paid','Approved':'s-approved','Sent':'s-sent','Opened':'s-opened','Pending approval':'s-pending','Expired':'s-expired','Cancelled':'s-cancelled','Declined':'s-declined','Failed':'s-failed','Draft':'s-expired'}[status] || 's-sent';
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}

function viewOrders() {

    const canRecover = o.status !== 'Approved' && !o.link;
    return `<tr>
      <td><input type="checkbox" id="sel-${o.id}" aria-label="Select ${o.id}" ${canRecover ? '' : 'disabled'} data-select="${o.id}"></td>
      <td class="mono">${o.id}</td>
      <td class="cust"><b>${esc(o.name)}</b><span>${esc(o.account)} \u00B7 ${esc(o.email)}</span></td>
      <td class="num">${money(o.amount, o.currency)}</td>
      <td>${esc(o.method)}${o.recovered ? ' <span class="muted">· via link</span>' : ''}</td>
      <td>${pill(o.status)}${o.reason ? `<div class="muted" style="font-size:12px">${esc(o.reason)}</div>` : ''}</td>
      <td class="mono muted">${hhmm(o.time)}</td>
      <td>${canRecover ? `<button class="btn btn-sm" data-action="recover" data-id="${o.id}">Send recovery link</button>`

  <div class="panel"><div class="table-wrap"><table>

}

function linksTable(list) {
  if (!list.length) return `<div class="empty">No links match this filter.</div>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Link</th><th>Customer</th><th>Amount</th><th>Methods</th><th>Status</th><th>Created by</th><th>Expires</th></tr></thead>
    <tbody>${list.map(l => `<tr class="clickable" data-action="open-link" data-id="${l.id}" ${l.status === 'Pending approval' ? 'data-pending="1"' : ''}>
      <td class="mono">${l.id}</td>
      <td class="cust"><b>${esc(l.name)}</b><span>${esc(l.account)} \u00B7 ${esc(l.email || l.phone)}</span></td>
      <td class="num">${money(l.amount, l.currency)}</td>
      <td>${esc(l.methods.join(', '))}</td>
      <td>${pill(l.status)}</td>
      <td>${esc(l.by)}</td>
      <td class="muted">${expiresText(l)}</td></tr>`).join('')}</tbody></table></div>`;
}
function expiresText(l) {
  if (['Paid','Expired','Cancelled'].includes(l.status)) return '–';
  if (l.status === 'Pending approval') return 'After approval';
  return l.expiry >= 48 ? `in ${Math.round(l.expiry / 24)} days` : `in ${l.expiry} h`;
}

function viewLinks() {
  const counts = s => S.links.filter(l => s === 'All' || l.status === s || (s === 'Open' && ['Sent','Opened','Pending approval'].includes(l.status))).length;
  const list = S.links.filter(l => (S.filter === 'All' || l.status === S.filter || (S.filter === 'Open' && ['Sent','Opened','Pending approval'].includes(l.status))))
    .filter(l => !S.q || (l.name + l.email + l.id).toLowerCase().includes(S.q.toLowerCase()));
  return `
  <div class="page-head"><h1>Payment Links</h1><span class="spacer"></span>
    <button class="btn btn-primary" data-action="new-link">+ New payment link</button></div>
  <div class="panel">

      <input class="search" id="search" type="search" placeholder="Search customer or link ID" value="${esc(S.q)}" aria-label="Search links"></div>
    ${linksTable(list)}
  </div>`;
}

function scLabel(sc) {
  const list = SCENARIOS.filter(x => x.group === sc.group);
  const i = list.indexOf(sc) + 1;
  return sc.group === 'safe' ? 'S' + i : String(i);
}
function renderGuide() {
  const sc = S.scenario && SCENARIOS.find(s => s.key === S.scenario);
  let html;
  if (!sc) {
    html = `<h2>Scenarios to try</h2>
      <p class="muted" style="margin:0;font-size:13px">Pick one. You’ll see its steps, and the next thing to click pulses on the screen.</p>
      <div class="scn"><div class="scn-group">Use cases</div>${SCENARIOS.filter(s => s.group === 'use').map(s => `
      <button class="scn-btn" data-scenario="${s.key}" aria-pressed="false"><span class="n">${scLabel(s)}</span><span><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></span></button>`).join('')}
      <div class="scn-group">Safeguards in action</div>${SCENARIOS.filter(s => s.group === 'safe').map(s => `
      <button class="scn-btn safe" data-scenario="${s.key}" aria-pressed="false"><span class="n">${scLabel(s)}</span><span><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></span></button>`).join('')}</div>`;
  } else {
    const idx = scLabel(sc);
    const n = sc.steps.length, doneN = Math.min(S.step, n), finished = S.step >= n;
    const cur = sc.steps[S.step];
    const showPlay = cur && ['customer:open', 'paid'].includes(cur.ev) && !S.modal && S.lastLink;
    const who = S.lastLink ? (link(S.lastLink).name || 'the customer').split(' ')[0] : '';
    html = `<button class="btn btn-sm back" data-action="all-scenarios">← All scenarios</button>
      <div class="panel steps">
        <div class="head"><span class="n">${idx}</span><div><div class="scn-group" style="margin:0">${sc.group === 'safe' ? 'Safeguard' : 'Use case'}</div><h3>${esc(sc.title)}</h3></div></div>
        <p class="story" style="margin:0">${esc(sc.story)}</p>
        <div class="progress"><span>${finished ? 'Completed' : `Step ${doneN + 1} of ${n}`}</span><div class="bar"><i style="width:${doneN / n * 100}%"></i></div></div>
        <ol>${sc.steps.map((st, i) => `<li class="${i < S.step ? 'done' : i === S.step ? 'now' : ''}">${esc(st.t)}</li>`).join('')}</ol>
        ${finished ? `<div class="finish">${esc(sc.done)}</div>` : ''}
      </div>
      ${showPlay ? `<div class="demo-ctl"><span class="tag">Demo control</span><p>In real life the customer gets the link on their own device. Step into their shoes:</p>
        <button class="btn btn-demo" data-action="simulate">Play the customer: open ${esc(who)}’s phone</button></div>` : ''}

  }
  html += `<div class="guide-foot"><button class="btn btn-sm" data-action="reset">Reset demo</button></div>`;

}
function applyGuide() {
  document.querySelectorAll('.guide-target').forEach(e => e.classList.remove('guide-target'));
  const sc = S.scenario && SCENARIOS.find(s => s.key === S.scenario);
  if (!sc || S.step >= sc.steps.length) return;
  let sel = sc.steps[S.step].sel;
  // "New payment link" lives on more than one page; point at the tab first if needed.
  let el = document.querySelector('#layer ' + sel) || document.querySelector(sel);
  if (!el && sel === '[data-action="new-link"]') el = document.querySelector('[data-nav="links"]');
  if (!el && sel === '[data-action="fill-example"]') el = document.querySelector('#create-continue');
  if (!el && sel === '[data-action="simulate"]') el = document.querySelector('[data-action="open-link"]');
  const draft = S.drawer?.type === 'create' ? S.drawer.draft : null;
  if (sel === '[data-action="fill-example"]' && draft && sc.example && draft.name === sc.example.name && S.scenario !== 'errors') el = document.querySelector('#create-continue');
  if (!el && sel === '[data-action="approve"]') el = document.querySelector('[data-pending="1"]') || document.querySelector('[data-nav="links"]');
  if (sc.steps[S.step].ev === 'sent' && S.drawer?.type === 'send') el = S.drawer.channel ? document.querySelector('#send-btn') : (document.querySelector(sel) || document.querySelector('[data-channel="Email"]'));
  if (S.modal?.stage === 'inbox') el = document.querySelector('[data-action="tap-link"]');
  if (!el && sel === '#pay-btn') el = document.querySelector('#guide [data-action="simulate"]');
  if (sel === '#pay-btn' && S.modal?.stage === 'checkout' && !S.modal.method) {
    const want = sc.key === 'recovery' ? 'eWallet' : (sc.example?.payWith || 'Card');
    el = document.querySelector(`[data-pay="${want}"]`) || el;
  }
  if (el) el.classList.add('guide-target');
}

/* ---------- QR (decorative, deterministic) ---------- */
function drawQR() {
  const c = $('#qr') || $('#qr-cust'); if (!c) return;
  const qid = S.modal?.id || S.drawer?.id || 'PL';
  const g = c.getContext('2d'); const n = 29; let s = 0;
  for (const ch of qid) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  g.fillStyle = '#fff'; g.fillRect(0, 0, n, n); g.fillStyle = '#111';
  const finder = (x, y) => { g.fillRect(x, y, 7, 7); g.fillStyle = '#fff'; g.fillRect(x + 1, y + 1, 5, 5); g.fillStyle = '#111'; g.fillRect(x + 2, y + 2, 3, 3); };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > 0.52) g.fillRect(x, y, 1, 1);
  }
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
}

  const a = document.activeElement; const id = a && a.id; const pos = a && 'selectionStart' in a ? (() => { try { return a.selectionStart; } catch { return null; } })() : null;
  renderLayer(); applyGuide();
  if (id) { const n = document.getElementById(id); if (n) { n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch {} } }
}

function createLink() {
  readForm();
  const d = S.drawer.draft; d.touched = true;
  const errs = validate(d);
  if (Object.keys(errs).length) {
    rerenderDrawerKeepFocus();
    if (S.scenario === 'errors') emit('errors:shown');
    return;
  }
  tick(1);
  const id = 'PL-' + (++seq);
  const over = toUSD(Number(d.amount), d.currency) > me().limit;
  const l = {id, account:d.account, name:d.name, email:d.email, phone:d.phone, country:d.country, amount:Number(d.amount), currency:d.currency, methods:[...d.methods], expiry:d.expiry, single:d.single, ref:d.ref, desc:d.desc, from:d.from,
    status: over ? 'Pending approval' : 'Sent', by: me().name, created:new Date(clock), channel:null,
    events:[{t:new Date(clock), l:`Created by ${me().name}${d.from ? ' from failed order ' + d.from : ''}`}]};
  S.links.unshift(l);
  if (d.from) { const o = S.orders.find(o => o.id === d.from); if (o) o.link = id; }
  log(`Created ${id} · ${money(l.amount, l.currency)}`);
  if (over) {
    l.events.push({t:new Date(clock), l:`Approval requested from a team lead (above ${money(me().limit)} limit)`});
    log(`Requested approval for ${id}`);
    S.drawer = null; S.view = 'links';
    toast('Sent for approval', `${id} will go out once a team lead approves it.`);
    render(); emit('create:continue'); emit('approval:requested'); return;
  }
  l.status = 'Draft';
  S.drawer = {type:'send', id, channel:null};
  render(); emit('create:continue');
}

function send() {
  const l = link(S.drawer.id); const ch = S.drawer.channel; if (!ch) return;
  tick(1);
  l.status = 'Sent'; l.channel = ch;
  l.events.push({t:new Date(clock), l: ch === 'Copy link' ? 'Link copied' : ch === 'QR code' ? 'Shown as QR code' : `Sent by ${ch}`});
  log(`${ch === 'Copy link' ? 'Copied' : ch === 'QR code' ? 'Showed QR for' : 'Sent'} ${l.id}${['Email','SMS'].includes(ch) ? ' by ' + ch : ''}`);
  toast(ch === 'Copy link' ? 'Link copied' : ch === 'QR code' ? 'Ready to scan' : 'Link sent', `${l.id} · ${money(l.amount, l.currency)} to ${l.name || l.email}`);
  S.lastLink = l.id;
  S.drawer = {type:'detail', id:l.id}; S.view = 'links';
  render(); emit('sent');
}

function pay() {
  const l = link(S.modal.id); const m = S.modal.method;
  if (m === 'Card') {
    const cvv = ($('#c-cvv')?.value || '').trim();
    if (cvv === '001') {
      tick(1); l.events.push({t:new Date(clock), l:'Card payment declined'}); S.modal.result = 'no';
      render(); return;
    }
  }
  tick(2);
  l.status = 'Paid';
  const oid = 'ORD-' + (88220 + S.orders.length);
  l.events.push({t:new Date(clock), l:`Paid by ${m} · order ${oid}`});
  S.orders.unshift({id:oid, account:l.account, name:l.name || l.email, email:l.email, country:l.country, amount:l.amount, currency:l.currency, method:m, status:'Approved', reason:'', time:new Date(clock), link:l.id, recovered: !!l.from});
  log(`${l.id} paid · ${money(l.amount, l.currency)} by ${m}`, 'System');
  S.modal.result = 'ok';
  render();
  toast(`${l.name || 'Customer'} paid ${money(l.amount, l.currency)}`, `${l.id} · notification sent to ${l.by}`);
  emit('paid');
}

function act(action, el) {
  const d = S.drawer;
  switch (action) {
    case 'new-link': openCreate(); break;
    case 'fill-example': {
      const sc = SCENARIOS.find(s => s.key === S.scenario); if (!sc?.example) return;
      S.drawer.draft = Object.assign(blankDraft(), JSON.parse(JSON.stringify(sc.example)), {touched:true});
      if (S.scenario === 'errors') { render(); emit('errors:shown'); return; }
      render(); break;
    }
    case 'create-continue': createLink(); break;
    case 'send': send(); break;
    case 'recover': {
      const o = S.orders.find(o => o.id === el.dataset.id);
      const methods = o.method === 'Card' ? ['Card', 'eWallet'] : [o.method, 'Card'];
      openCreate(Object.assign(blankDraft(), {name:o.name, account:o.account, email:o.email, country:o.country, amount:String(o.amount), currency:o.currency, methods, expiry:48, from:o.id, desc:'Complete your deposit'}));
      emit('recovery:open'); break;
    }
    case 'bulk-recover': {
      const ids = [...document.querySelectorAll('[data-select]:checked')].map(x => x.dataset.select);
      if (!ids.length) { toast('Select failed orders first', 'Tick the orders you want to follow up.'); return; }
      ids.forEach(oid => {
        const o = S.orders.find(o => o.id === oid); tick(1);
        const id = 'PL-' + (++seq);
        S.links.unshift({id, account:o.account, name:o.name, email:o.email, phone:'', country:o.country, amount:o.amount, currency:o.currency, methods: o.method === 'Card' ? ['Card','eWallet'] : [o.method,'Card'], expiry:48, single:true, status:'Sent', by:me().name, created:new Date(clock), channel:'Email', from:o.id,
          events:[{t:new Date(clock), l:`Created by ${me().name} from failed order ${o.id}`},{t:new Date(clock), l:'Sent by email'}]});
        o.link = id; log(`Sent recovery link ${id} for ${o.id}`);
      });
      toast(`${ids.length} recovery link${ids.length > 1 ? 's' : ''} sent`, 'Each one is prefilled from its failed order.');
      render(); break;
    }
    case 'open-link': S.drawer = {type:'detail', id: el.dataset.id}; render(); break;
    case 'simulate': {
      const id = S.lastLink || d?.id; if (!id) return;
      S.modal = {id, stage:'inbox', method:null, result:null}; render(); emit('customer:open'); break;
    }
    case 'tap-link': {
      const l = link(S.modal.id); tick(3);
      if (l.status === 'Sent') { l.status = 'Opened'; l.events.push({t:new Date(clock), l:'Opened by customer'}); }
      S.modal.stage = 'checkout'; render(); break;
    }
    case 'preview': S.modal = {id:d.id, stage:'preview'}; render(); break;
    case 'all-scenarios': S.scenario = null; S.step = 0; S.drawer = null; S.modal = null; render(); break;
    case 'pay': pay(); break;
    case 'remind': { const l = link(d.id); tick(60 * 24); l.events.push({t:new Date(clock), l:`Reminder sent by ${l.email ? 'email' : 'SMS'}`}); log(`Sent reminder for ${l.id}`); toast('Reminder sent', `${l.name || l.email} was reminded about ${l.id}.`); render(); emit('reminder'); break; }
    case 'extend': { const l = link(d.id); l.expiry += 24; tick(1); l.events.push({t:new Date(clock), l:'Expiry extended by 24 hours'}); log(`Extended ${l.id}`); render(); break; }
    case 'cancel': { const l = link(d.id); tick(1); l.status = 'Cancelled'; l.events.push({t:new Date(clock), l:`Cancelled by ${me().name}`}); log(`Cancelled ${l.id}`); toast('Link cancelled', 'The customer can no longer pay with it.'); render(); break; }
    case 'duplicate': { const l = link(d.id); openCreate(Object.assign(blankDraft(), {name:l.name, account:l.account, email:l.email, phone:l.phone, country:l.country, amount:String(l.amount), currency:l.currency, methods:[...l.methods], expiry:l.expiry})); break; }
    case 'send-draft': S.drawer = {type:'send', id:d.id, channel:null}; render(); break;
    case 'refund': toast('Refund started', 'This uses the existing Refunds flow.'); break;
    case 'approve': {
      const l = link(d.id); tick(2);
      l.status = 'Sent'; l.events.push({t:new Date(clock), l:`Approved by ${me().name}`}, {t:new Date(clock), l:`Sent by ${l.email ? 'email' : 'SMS'}`});
      S.lastLink = l.id; log(`Approved ${l.id}`); log(`Sent ${l.id} by ${l.email ? 'email' : 'SMS'}`);
      toast('Approved and sent', `${l.id} went to ${l.name || l.email}.`); render(); emit('approved'); break;
    }
    case 'reset': seed(); render(); toast('Demo reset', 'All sample data is back to the start.'); break;
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('[data-nav]');
  if (nav && !nav.disabled) { S.view = nav.dataset.nav; S.drawer = null; S.modal = null; render(); emit('nav:' + S.view); return; }
  const sc = t.closest('[data-scenario]'); if (sc) { startScenario(sc.dataset.scenario); return; }
  const f = t.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; render(); return; }
  const ch = t.closest('[data-channel]'); if (ch && !ch.disabled) {
    S.drawer.channel = ch.dataset.channel; renderLayer(); drawQR(); applyGuide();
    const sc2 = S.scenario && SCENARIOS.find(s => s.key === S.scenario);
    if (sc2 && sc2.steps[S.step]?.ev === 'sent' && sc2.steps[S.step].sel.includes(ch.dataset.channel)) { $('#send-btn').classList.add('guide-target'); ch.classList.remove('guide-target'); }
    return;
  }
  const p = t.closest('button[data-pay]'); if (p) { S.modal.method = p.dataset.pay; S.modal.result = null; render(); return; }
  if (t.matches('[data-close]') || (t.closest('button[data-close]'))) {
    const which = (t.closest('[data-close]')).dataset.close;
    if (t.closest('.drawer') && !t.closest('button[data-close]')) return;
    if (t.closest('.modal') && !t.closest('button[data-close]')) return;
    if (which === 'modal') S.modal = null; else S.drawer = null;
    render(); return;
  }
  const a = t.closest('[data-action]');
  if (a && !a.disabled) {
    act(a.dataset.action, a);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'role-select') { setRole(t.value); render(); return; }
  if (t.id === 'test-mode') { S.testMode = t.checked; render(); return; }
  if (S.drawer?.type === 'create' && t.closest('.drawer')) {
    readForm(); if (S.drawer.draft.email || S.drawer.draft.amount) S.drawer.draft.touched = true;
    rerenderDrawerKeepFocus(); checkFixed();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { S.q = t.value; const pos = t.selectionStart; render(); const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos); return; }
  if (S.drawer?.type === 'create' && t.closest('.drawer') && t.type !== 'checkbox') {
    readForm(); if (S.drawer.draft.touched) { rerenderDrawerKeepFocus(); checkFixed(); }
  }
});
document.addEventListener('focusout', e => {
  if (S.drawer?.type === 'create' && e.target.closest?.('.drawer') && ['f-email','f-amount'].includes(e.target.id) && e.target.value) {
    readForm(); S.drawer.draft.touched = true; setTimeout(() => { if (S.drawer?.type === 'create' && !document.activeElement?.closest?.('.drawer')) rerenderDrawerKeepFocus(); }, 0);
  }
});
function checkFixed() {
  if (S.scenario !== 'errors') return;
  const d = S.drawer.draft;
  if (!Object.keys(validate(d)).length) emit('errors:fixed');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.drawer) S.drawer = null; else return; render(); }
});

seed();
render();
})();
</script>
</body>
</html>
